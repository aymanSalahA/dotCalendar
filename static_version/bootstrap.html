<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles to match the original design intent (f1f5f9 is slate-100) */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }

        /* --- Custom Mark Styles (Retained from Original) --- */

        /* Base styles for the status marks */
        .check-mark::after,
        .x-mark::after,
        .skip-mark::after {
            position: absolute;
            top: 62%;
            /* Lowered the icons from 55% */
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            /* Ensure it's above the dot */
            font-weight: bold;
            font-size: 1.1rem;
            /* Slightly larger for better visibility */
            line-height: 1;
        }

        /* Check mark for 'isDone: true' */
        .check-mark::after {
            content: "✓";
            color: #16a34a;
            /* Dark green (green-700) */
        }

        /* X mark for 'isDone: false' and 'isSkipped: false' */
        .x-mark::after {
            content: "✗";
            color: #dc2626;
            /* Dark red (red-700) */
        }

        /* Dot mark for 'isSkipped: true' */
        .skip-mark::after {
            content: "•";
            /* Changed icon for skipped */
            color: #f59e0b;
            /* Changed color to amber/yellow (amber-500) */
            font-size: 1.5rem;
            /* Made the dot a bit larger */
        }

        /* --- Calendar Grid Utility Styles (Customized for Bootstrap) --- */

        /* Replicates the Tailwind 'grid grid-cols-7' and 'gap-1' */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.25rem;
        }

        /* Replicates the Tailwind 'h-14 flex items-center justify-center' */
        .day-cell {
            height: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
            /* text-lg */
            font-weight: 500;
            /* font-medium */
        }

        /* Replicates the Tailwind 'w-9 h-9 rounded-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2' */
        .dot-background {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2.25rem;
            /* w-9 */
            height: 2.25rem;
            /* h-9 */
            border-radius: 50%;
            z-index: 10;
        }

        /* Replicates the Tailwind 'w-8 h-8 rounded-full relative z-20 flex items-center justify-center' */
        .day-number {
            position: relative;
            z-index: 20;
            width: 2rem;
            /* w-8 */
            height: 2rem;
            /* h-8 */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-4">
    <div class="w-100" style="max-width: 512px;">
        <div class="bg-white rounded-4 shadow-lg p-4 p-md-5">
            <div class="text-center mb-4">
                <h1 id="habit-name" class="fs-4 fw-bold text-dark"></h1>
                <p id="month-year" class="text-muted mb-0"></p>
                </div>

            <div class="calendar-grid text-center small fw-semibold text-muted mb-2">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>

            <div class="calendar-grid" id="calendar-grid">
                </div>
        </div>
    </div>

    <script>
        // --- Mock Server API Data ---
        const apiData = {
            year: "2025",
            month: "10",
            habitName: "Daily Morning Run",
            items: [
                { day: "01-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "02-10-2025", isValid: true, isDone: false, isSkipped: false },
                { day: "03-10-2025", isValid: false, isDone: false, isSkipped: false },
                { day: "04-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "05-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "06-10-2025", isValid: true, isDone: false, isSkipped: true },
                { day: "07-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "08-10-2025", isValid: false, isDone: false, isSkipped: false },
                { day: "09-10-2025", isValid: true, isDone: false, isSkipped: false },
                { day: "10-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "11-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "12-10-2025", isValid: false, isDone: false, isSkipped: false },
                { day: "13-10-2025", isValid: true, isDone: false, isSkipped: true },
                { day: "14-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "15-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "16-10-2025", isValid: true, isDone: false, isSkipped: false },
                { day: "17-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "18-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "19-10-2025", isValid: true, isDone: false, isSkipped: true },
                { day: "20-10-2025", isValid: false, isDone: false, isSkipped: false },
                { day: "21-10-2025", isValid: true, isDone: false, isSkipped: false },
                { day: "22-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "23-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "24-10-2025", isValid: true, isDone: false, isSkipped: true },
                { day: "25-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "26-10-2025", isValid: false, isDone: false, isSkipped: false },
                { day: "27-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "28-10-2025", isValid: true, isDone: false, isSkipped: false },
                { day: "29-10-2025", isValid: true, isDone: true, isSkipped: false },
                { day: "30-10-2025", isValid: true, isDone: false, isSkipped: true },
                { day: "31-10-2025", isValid: true, isDone: true, isSkipped: false },
            ]
        };

        // --- Calendar Generation Logic ---

        // Get references to HTML elements
        const grid = document.getElementById("calendar-grid");
        const habitNameEl = document.getElementById("habit-name");
        const monthYearEl = document.getElementById("month-year");

        // Parse data from the API response
        const year = parseInt(apiData.year);
        // JavaScript months are 0-indexed (0=Jan), so we subtract 1.
        const month = parseInt(apiData.month) - 1;

        // Get the first day of the month (0=Sun, 1=Mon, ..., 6=Sat)
        const firstDayOfMonth = new Date(year, month, 1).getDay();

        // Create a date object for formatting the month name
        const date = new Date(year, month);
        const monthName = date.toLocaleString('default', { month: 'long' });

        // Update the header text
        habitNameEl.textContent = apiData.habitName;
        monthYearEl.textContent = `${monthName} ${year}`;

        let calendarHTML = '';

        // Add empty cells for the days before the 1st of the month
        for (let i = 0; i < firstDayOfMonth; i++) {
            calendarHTML += `<div></div>`;
        }

        // Populate the grid with data from the `items` array
        apiData.items.forEach(item => {
            let statusClass = "";
            let dotClass = "bg-light"; // Default to gray for invalid days (slate-100)

            // Determine which mark and dot color to show.
            if (item.isValid) {
                // For ANY valid day (done, not done, or skipped), the background dot is green.
                dotClass = "bg-success-subtle"; // Bootstrap equivalent of green-100

                if (item.isSkipped) {
                    statusClass = "skip-mark"; // • (yellow icon)
                } else if (item.isDone) {
                    statusClass = "check-mark"; // ✓ (green icon)
                } else {
                    statusClass = "x-mark"; // ✗ (red icon)
                }
            }

            // Extract the day number from the "DD-MM-YYYY" string.
            const dayNumber = parseInt(item.day.substring(0, 2), 10);

            // Highlight the current day
            const isToday = new Date().getDate() === dayNumber &&
                new Date().getMonth() === month &&
                new Date().getFullYear() === year;

            // Use Bootstrap classes for text color and today's highlight
            // text-slate-700 -> text-dark, bg-blue-600 -> bg-primary
            const dayNumberClass = isToday ? 'bg-primary text-white' : 'text-dark';

            calendarHTML += `
                <div class="position-relative day-cell ${statusClass}">
                    <span class="dot-background ${dotClass}"></span>
                    <span class="day-number ${dayNumberClass}">${dayNumber}</span>
                </div>`;
        });

        grid.innerHTML = calendarHTML;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
